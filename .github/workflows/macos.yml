name: Encrypted macOS package build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install authenticated encryption library
        run: python -m pip install cryptography
      - name: Decrypt and validate private inputs
        env:
          DUODUO_BUILD_KEY: ${{ secrets.DUODUO_BUILD_KEY }}
        run: python private_build.py unpack
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Select supported Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
      - name: Build installers with private logs
        run: python private_build.py build
      - name: Encrypt results and diagnostic logs
        if: always()
        env:
          DUODUO_BUILD_KEY: ${{ secrets.DUODUO_BUILD_KEY }}
        run: python private_build.py seal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Encrypted-macOS-${{ matrix.arch }}
          path: sealed/
          if-no-files-found: error
          retention-days: 1
